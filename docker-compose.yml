name: quite-up

# Nota de arquitetura:
#   - Este compose NÃO publica 80/443 nem roda Caddy. O reverse proxy público é o Caddy do
#     ExactLab (mesma VPS), que fala com api/frontend pela rede Docker externa "proxy"
#     (criada com `docker network create proxy`).
#   - db e rabbitmq ficam SOMENTE na rede interna deste projeto (nada é publicado no host).
#   - Os aliases quite-up-api / quite-up-frontend são os upstreams usados no Caddyfile do ExactLab.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-quite-up}
      Jwt__Audience: ${JWT_AUDIENCE:-quite-up-client}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}
      Hashids__Salt: ${HASHIDS_SALT}
      Hashids__MinLength: ${HASHIDS_MIN_LENGTH:-8}
      RabbitMQ__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__Port: ${RABBITMQ_PORT:-5672}
      RabbitMQ__User: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromName: ${SMTP_FROM_NAME:-Quite-Up}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      App__Url: ${APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - quite-up-api

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default:
      proxy:
        aliases:
          - quite-up-frontend

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  proxy:
    external: true
